name: Update profile
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev
      - run: node src/update.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "janky-bot"
          git config user.email "janky-bot@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "[Bot] Auto update profile" && git push)
